# 离线 / 内网本机构建用的 Cargo 清单（只适用于已把 zed / blade / font-kit 本地化的 Linux 机器）。
#
# 用法（在离线 Linux 机器上）：
#   cp Cargo.offline.toml Cargo.toml      # 切到本地化依赖
#   cargo run --release
# 切回可移植（Windows 友好）版本：
#   cp Cargo.portable.toml Cargo.toml     # 见 scripts/use-portable.sh
#
# 说明：本机访问 GitHub 极慢，gpui 使用已本地化的 zed 0.195.5 源码，
# 并把它的两个 git 子依赖（blade / font-kit）重定向到本地副本。

[package]
name = "kafka-ui"
version = "0.1.0"
edition = "2021"
description = "Kafka UI — 基于 GPUI 的桌面版 Kafka 管理工具"
license = "MIT"
authors = ["kafka-ui"]
readme = "README.md"

[[bin]]
name = "kafka-ui"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "fs",
] }
kafka_client = "0.8"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
futures = "0.3"
unicode-segmentation = "1"

gpui = { git = "file:///tmp/zed-src/zed-0.195.5" }

[patch."https://github.com/kvark/blade"]
blade-graphics = { path = "/tmp/blade/blade-graphics" }
blade-macros = { path = "/tmp/blade/blade-macros" }
blade-util = { path = "/tmp/blade/blade-util" }

[patch."https://github.com/zed-industries/font-kit"]
font-kit = { path = "/tmp/font-kit" }

[profile.release]
opt-level = 2
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
